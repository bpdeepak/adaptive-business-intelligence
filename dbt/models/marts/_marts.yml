version: 2

models:
  - name: fct_orders
    description: >
      One row per order with item/payment/review aggregates and business status
      flags. The core grain for Phase 0 metrics.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: customer_unique_id
        tests: [not_null]
      - name: order_status
        tests: [not_null]
      - name: order_purchase_date
        tests: [not_null]
      - name: item_count
        tests: [not_null]
      - name: payment_value_total
        tests: [not_null]
      - name: is_lost
        tests: [not_null]
      - name: is_delivered
        tests: [not_null]

  - name: fct_order_items
    description: >
      One row per order line item joined with order attributes. The producer
      (Phase 1) reads this table to replay order + item detail onto the stream.
    columns:
      - name: order_id
        description: Refers to fct_orders.order_id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: order_item_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: seller_id
        tests: [not_null]
      - name: price
        tests: [not_null]
      - name: freight_value
        tests: [not_null]
      - name: item_total
        tests: [not_null]

  - name: dim_customers
    description: One row per customer_unique_id (business entity).
    columns:
      - name: customer_unique_id
        tests: [unique, not_null]

  - name: dim_products
    description: One row per product with English category name.
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: product_category
        tests: [not_null]

  - name: dim_sellers
    description: One row per seller.
    columns:
      - name: seller_id
        tests: [unique, not_null]

  - name: dim_dates
    description: Day spine over the observed purchase-date range.
    columns:
      - name: date
        tests: [unique, not_null]

  - name: daily_revenue
    description: Revenue and contributing order count per purchase date.
    columns:
      - name: date
        tests: [unique, not_null]
      - name: order_count
        tests: [not_null]
      - name: revenue
        tests: [not_null]

  - name: daily_orders
    description: Total/delivered/lost order counts per purchase date.
    columns:
      - name: date
        tests: [unique, not_null]
      - name: total_orders
        tests: [not_null]

  - name: daily_aov
    description: Average order value per purchase date.
    columns:
      - name: date
        tests: [unique, not_null]
      - name: aov
        tests: [not_null]

  - name: top_categories
    description: Category aggregates ranked by revenue and orders.
    columns:
      - name: product_category
        tests: [unique, not_null]
      - name: revenue_rank
        tests: [not_null]
      - name: order_rank
        tests: [not_null]

  - name: feature_forecast_weekly
    description: >
      Phase 2 feature store for the demand-forecast model. One row per
      (category, ISO-week) over a dense, zero-filled weekly spine with
      time-lags (1/2/4/8 weeks) and rolling 4-week aggregates. Revenue per
      category is payment-value allocated across line items by price share,
      so category revenue is mutually exclusive and additive.
    columns:
      - name: category
        tests: [not_null]
      - name: week_start
        tests: [not_null]
      - name: revenue
        tests: [not_null]
      - name: orders
        tests: [not_null]

  - name: feature_customer_churn
    description: >
      Phase 2 feature store for the customer-churn model. One row per REPEAT
      customer (>=2 orders); as-of is the penultimate order; the label is read
      from the observed last order (churned = gap > 90 days), fully resolved.
      Two honesty rules: rows whose 90-day label window is not yet in-data are
      excluded, and no as_of_year feature (a drift proxy) is exposed — only
      as_of_month seasonality. All features use only orders before as-of.
    columns:
      - name: customer_unique_id
        tests: [unique, not_null]
      - name: as_of_date
        tests: [not_null]
      - name: churned
        tests: [not_null]
      - name: n_prior_orders
        tests: [not_null]
      - name: total_spend_prior
        tests: [not_null]