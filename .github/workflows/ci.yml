name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: dbt + Go + realtime pipeline + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # Postgres + MinIO + Redpanda come from the same compose file used in
      # local dev, so CI exercises the exact stack smoke_test.ps1 does.
      - name: Start infrastructure (Postgres + MinIO + Redpanda)
        run: docker compose up -d --wait

      - name: Download Olist dataset
        run: uv run python scripts/download_olist.py

      - name: Load bronze (MinIO + Postgres)
        run: uv run python loader/loader.py

      - name: dbt build (silver + gold + tests)
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: dbt docs generate
        run: uv run dbt docs generate --project-dir dbt --profiles-dir dbt

      - name: Phase 2 ML — dependency sync + unit tests
        run: |
          uv sync --group ml
          uv run --group ml python -m pytest ml/tests -q

      - name: Phase 2 ML — smoke feature build + training (scratch Postgres tables)
        run: |
          ## The builders (re)create their non-SQL feature stores in the CI
          ## Postgres with small limits; the trainers disable registry/prediction
          ## writes (--skip-persist) and just prove the backtests run end to end.
          uv run --group ml python ml/build_fraud_features.py --limit 20000
          uv run --group ml python ml/replay_session_corpus.py --limit-orders 500 --max-abandon-per-day 20
          uv run --group ml python ml/train_forecast.py --skip-persist
          uv run --group ml python ml/train_churn.py --skip-persist
          uv run --group ml python ml/train_fraud.py --skip-persist
          uv run --group ml python ml/train_bot.py --skip-persist

      - name: Go vet + unit + integration tests
        env:
          # The integration tests verify real SQL and the live Redpanda ->
          # Postgres realtime pipeline; they skip when the stack is down.
          ABI_TEST_DATABASE_URL: postgres://abi:abi@localhost:5432/abi?sslmode=disable
          ABI_TEST_KAFKA: localhost:29092
        run: |
          cd api
          go vet ./...
          go test ./...
          go test -tags integration ./internal/store/ ./internal/realtime/ ./internal/predict/

      - name: Build binaries + end-to-end smoke test
        run: |
          make app
          bash scripts/smoke_check.sh